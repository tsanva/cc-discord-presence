name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$2" != "$want" ]; then
              echo "::error file=$1::version is '$2', tag is $GITHUB_REF_NAME"
              fail=1
            fi
          }
          check .claude-plugin/plugin.json      "$(jq -r .version .claude-plugin/plugin.json)"
          check .claude-plugin/marketplace.json "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          check scripts/start.sh  "$(sed -n 's/^VERSION="v\(.*\)"$/\1/p' scripts/start.sh)"
          check scripts/start.ps1 "$(sed -n 's/^\$Version = "v\(.*\)"$/\1/p' scripts/start.ps1)"
          exit $fail

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p bin

          GOOS=darwin GOARCH=arm64 go build -o bin/cc-discord-presence-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o bin/cc-discord-presence-darwin-amd64 .
          GOOS=linux GOARCH=amd64 go build -o bin/cc-discord-presence-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o bin/cc-discord-presence-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o bin/cc-discord-presence-windows-amd64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
